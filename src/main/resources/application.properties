spring.application.name=employee
server.port=8080

# 1. Database Connection URL (REMOVED the password parameter completely)
spring.datasource.url=jdbc:sqlserver://emp-server1.database.windows.net:1433;database=employeeDB1;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

# 2. Database Authentication Credentials (Aligned with URL user principal name)
spring.datasource.username=emp-server1@emp-server1

# 3. Azure Key Vault Endpoint Location
spring.cloud.azure.keyvault.secret.property-sources.endpoint=https://emp-key-vault1.vault.azure.net/

# 4. Secure Key Vault Data Source Mapping
spring.datasource.password=${spring-datasource-password}

# Database Driver Class Name
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Configurations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

# Kafka Configurations
spring.kafka.bootstrap-servers=employee-kafka-ns.servicebus.windows.net:9093
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN

